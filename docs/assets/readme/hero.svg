<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Legend AI Toolkit</title>
  <desc id="d">Brasão com escudo vinho e ouro, um pergaminho e um lacre, sobre duas espadas cruzadas, ao lado de um estandarte com o nome Legend AI Toolkit e o lema Kit de Ferramentas das Lendas da IA.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d14"/>
      <stop offset="1" stop-color="#4a2f1f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b2a37"/>
      <stop offset="1" stop-color="#5e1520"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d27a"/>
      <stop offset="1" stop-color="#b8891d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c6bd"/>
      <stop offset=".5" stop-color="#f4f2ec"/>
      <stop offset="1" stop-color="#9c978b"/>
    </linearGradient>
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.2" fill="#f1d27a" opacity=".35"/>
      <circle cx="44" cy="40" r="0.9" fill="#f3e7c9" opacity=".3"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#stars)"/>
  <rect x="14" y="14" width="1172" height="392" rx="10" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="24" y="24" width="1152" height="372" rx="6" fill="none" stroke="#c9a227" stroke-opacity=".35" stroke-width="1"/>

  <g transform="translate(210 212) rotate(40)">
    <g id="sword">
      <path d="M0 -190 L11 -162 L11 90 L-11 90 L-11 -162 Z" fill="url(#steel)" stroke="#4a3a22" stroke-width="2" stroke-linejoin="round"/>
      <line x1="0" y1="-155" x2="0" y2="84" stroke="#8d877a" stroke-width="2"/>
      <rect x="-44" y="88" width="88" height="11" rx="5.5" fill="url(#gold)" stroke="#6b4f10" stroke-width="1.5"/>
      <circle cx="-44" cy="93.5" r="7" fill="#c9a227" stroke="#6b4f10" stroke-width="1.5"/>
      <circle cx="44" cy="93.5" r="7" fill="#c9a227" stroke="#6b4f10" stroke-width="1.5"/>
      <rect x="-6.5" y="99" width="13" height="40" rx="3" fill="#5e1520" stroke="#3b0d14" stroke-width="1.5"/>
      <g stroke="#c9a227" stroke-width="1.5" opacity=".8"><line x1="-6" y1="107" x2="6" y2="111"/><line x1="-6" y1="117" x2="6" y2="121"/><line x1="-6" y1="127" x2="6" y2="131"/></g>
      <circle cy="148" r="10" fill="url(#gold)" stroke="#6b4f10" stroke-width="1.5"/>
    </g>
  </g>
  <g transform="translate(210 212) rotate(-40)">
    <use href="#sword"/>
  </g>

  <path d="M150 100 h120 v90 c0 70 -60 110 -60 110 c0 0 -60 -40 -60 -110 z" fill="url(#shield)" stroke="url(#gold)" stroke-width="5"/>
  <path d="M210 112 v176" stroke="#c9a227" stroke-width="3" opacity=".5"/>
  <path d="M162 180 h96" stroke="#c9a227" stroke-width="3" opacity=".5"/>
  <rect x="182" y="128" width="56" height="40" rx="4" fill="#f3e7c9"/>
  <g stroke="#7a1f2b" stroke-width="2"><line x1="190" y1="138" x2="230" y2="138"/><line x1="190" y1="147" x2="226" y2="147"/><line x1="190" y1="156" x2="220" y2="156"/></g>
  <circle cx="210" cy="232" r="21" fill="#7a1f2b" stroke="#f1d27a" stroke-width="3"/>
  <path d="M200 232 l7 7 l13 -14" fill="none" stroke="#f1d27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M370 150 h760 l-30 50 l30 50 h-760 l30 -50 z" fill="#f3e7c9" stroke="url(#gold)" stroke-width="4"/>
  <text x="750" y="219" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#5e1520" letter-spacing="2">Legend AI Toolkit</text>
  <text x="750" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#f1d27a">Kit de Ferramentas das Lendas da IA</text>
  <text x="750" y="345" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f3e7c9" opacity=".85" letter-spacing="4">DO PEDIDO AO MERGE, COM SELO E TESTEMUNHA</text>
</svg>
