      <circle r="42" fill="none" stroke="#f1d27a" stroke-width="2" opacity=".7"/>
      <text y="6" font-size="17" font-weight="700" fill="#f3e7c9">review</text>
      <text y="102" font-size="16" fill="#f1d27a">todo PR</text>
    </g>
    <g transform="translate(330 150)">
      <use href="#wax" fill="#b8891d" stroke="#6b4f10" stroke-width="3"/>
      <circle r="42" fill="none" stroke="#3b2a1a" stroke-width="2" opacity=".5"/>
      <text y="7" font-size="21" font-weight="700" fill="#3b2a1a">e2e</text>
      <text y="102" font-size="16" fill="#f1d27a">PR de API</text>
