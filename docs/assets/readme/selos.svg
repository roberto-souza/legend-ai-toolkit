<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Os selos e o portão</title>
  <desc id="d">Quatro lacres de cera sobre uma fita: review, exigido em todo PR; e2e, para PR de API; screen e ux, para PR de tela. À direita, um portão que só abre para o comando de merge com número, depois de conferir todos os selos do commit.</desc>
