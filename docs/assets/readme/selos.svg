      <text y="6" font-size="17" font-weight="700" fill="#f3e7c9">screen</text>
      <text y="102" font-size="16" fill="#f1d27a">PR de tela</text>
    </g>
    <g transform="translate(730 150)">
      <use href="#wax" fill="#3d3a7a" stroke="#1f1d40" stroke-width="3"/>
      <circle r="42" fill="none" stroke="#f1d27a" stroke-width="2" opacity=".6"/>
      <text y="7" font-size="21" font-weight="700" fill="#f3e7c9">ux</text>
      <text y="102" font-size="16" fill="#f1d27a">PR de tela</text>
