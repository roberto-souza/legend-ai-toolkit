name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  guard:
    name: Confere a release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag, main, VERSION e CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Pre-releases are not published." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi
          if [[ "v$(cat VERSION)" != "$TAG" ]]; then
            echo "VERSION ($(cat VERSION)) does not match the tag $TAG." >&2
            exit 1
          fi
          node scripts/release-notes.mjs "$TAG" > /dev/null

  validate:
    needs: guard
    uses: ./.github/workflows/validate.yml
