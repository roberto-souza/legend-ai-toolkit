name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: test e guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - name: Guarda de neutralidade
        run: npm run guard
      - name: Versão nova para o que o projeto recebe
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/version-guard.mjs "origin/$BASE_REF"
